<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./elements/anchorpoint-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnchorPoint</title>
    <!-- applied before React mounts so there's no light-mode flash for
         returning dark-mode users -->
    <script>
      (function () {
        var stored = localStorage.getItem('anchorpoint-theme')
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
